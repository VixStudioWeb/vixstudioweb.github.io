<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="vixGradientMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D"/>
      <stop offset="50%" style="stop-color:#F5C518"/>
      <stop offset="100%" style="stop-color:#D4A817"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="40" cy="40" r="38" fill="#0A0A0A"/>
  
  <!-- Decorative ring -->
  <circle cx="40" cy="40" r="35" fill="none" stroke="url(#vixGradientMark)" stroke-width="1" opacity="0.3"/>
  
  <!-- V letter with glow -->
  <text x="40" y="52" font-family="Georgia, Playfair Display, serif" font-size="42" font-weight="900" fill="url(#vixGradientMark)" text-anchor="middle" filter="url(#glow)">V</text>
  
  <!-- Accent dots -->
  <circle cx="15" cy="40" r="2" fill="#F5C518" opacity="0.6"/>
  <circle cx="65" cy="40" r="2" fill="#F5C518" opacity="0.6"/>
</svg>
