<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="vixGradientLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD93D"/>
      <stop offset="50%" style="stop-color:#F5C518"/>
      <stop offset="100%" style="stop-color:#D4A817"/>
    </linearGradient>
  </defs>
  
  <!-- Vix text -->
  <text x="0" y="42" font-family="Georgia, Playfair Display, serif" font-size="48" font-weight="900" fill="url(#vixGradientLogo)">Vix</text>
  
  <!-- Studio Web text -->
  <text x="78" y="42" font-family="Montserrat, sans-serif" font-size="18" font-weight="300" fill="#FFFFFF" letter-spacing="2">Studio Web</text>
</svg>
